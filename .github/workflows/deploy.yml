name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t finpulze-app:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: finpulze-app:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: 'os,library'

  deploy:
    name: Deploy to EC2
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SCP files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/app"

      - name: Deploy Docker container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app

            sudo docker stop finpulze-app || true
            sudo docker rm finpulze-app || true

            sudo docker build -t finpulze-app .

            sudo docker run -d \
              --name finpulze-app \
              --env-file /home/ubuntu/.env \
              -p 127.0.0.1:8000:8000 \
              finpulze-app